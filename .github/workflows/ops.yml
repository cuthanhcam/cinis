name: Ops

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Windows ops checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Rust components
        run: rustup show
      - name: Test process runner
        run: python -m unittest discover -s ops/tests -v
      - name: Verify engine through public runner
        shell: powershell
        run: ./ops/scripts/Invoke-Cinis.ps1 -Task Verify
      - name: Run matching demo with logs
        shell: powershell
        run: ./ops/scripts/Invoke-Cinis.ps1 -Task Run
      - name: Verify platform through public runner
        shell: powershell
        run: ./ops/scripts/Invoke-Cinis.ps1 -Project Platform -Task Verify
      - name: Run platform smoke with logs
        shell: powershell
        run: ./ops/scripts/Invoke-Cinis.ps1 -Project Platform -Task Run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ops-logs
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
