name: Platform

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore src/platform/Cinis.Platform.slnx --locked-mode
      - run: dotnet format src/platform/Cinis.Platform.slnx whitespace --no-restore --verify-no-changes
      - run: dotnet build src/platform/Cinis.Platform.slnx --no-restore -c Release
      - run: dotnet test src/platform/Cinis.Platform.slnx --no-build --no-restore -c Release
      - run: dotnet run --project src/platform/Cinis.Platform --no-build --no-restore -c Release -- --smoke-test
      - name: Install pinned Rust research toolchain
        run: rustup show
      - name: Build isolated Rust research peer
        run: cargo build --locked --manifest-path src/engine/Cargo.toml --bin cinis-wire-probe
      - run: dotnet restore research/protocol-spike/Cinis.ProtocolProbe.csproj --locked-mode
      - run: dotnet format research/protocol-spike/Cinis.ProtocolProbe.csproj whitespace --no-restore --verify-no-changes
      - run: dotnet build research/protocol-spike/Cinis.ProtocolProbe.csproj --no-restore -c Release
      - name: Run real cross-language funding experiment
        run: dotnet run --project research/protocol-spike/Cinis.ProtocolProbe.csproj --no-build --no-restore -c Release -- . src/engine/target/debug/cinis-wire-probe
