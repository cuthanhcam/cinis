name: Engine

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and components
        run: rustup show
      - run: cargo fmt --manifest-path src/engine/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src/engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src/engine/Cargo.toml
      - run: cargo run --locked --manifest-path src/engine/Cargo.toml --bin cinis-demo
      - run: cargo run --locked --manifest-path src/engine/Cargo.toml --bin cinis-matching-demo
