name: Engine

on:
  push:
    branches: [main, develop, 'feature/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and components
        run: rustup show
      - run: cargo fmt --manifest-path src/engine/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src/engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src/engine/Cargo.toml
      - run: cargo run --locked --manifest-path src/engine/Cargo.toml --bin cinis-demo
