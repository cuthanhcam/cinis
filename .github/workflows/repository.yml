name: Repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Workflow and scaffold checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate workflow syntax and expressions
        run: python ops/scripts/check_workflows.py
      - name: Check scaffold and ignore contracts
        run: python ops/scripts/check_scaffold.py
      - name: Test exact-commit CI gate
        run: python -m unittest discover -s ops/tests -p test_ci_gate.py -v
